<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="dashboard">
        <h1>Server Dashboard</h1>
        
        <div class="card">
            <h2>CPU Usage</h2>
            <p id="cpu-value" class="data-text">Loading...</p>
        </div>

        <div class="card">
            <h2>CPU Temperature</h2>
            <p id="tmp-value" class="data-text">Loading...</p>
        </div>

        <div class="card">
            <h2>Memory Usage</h2>
            <p id="mem-value" class="data-text">Loading...</p>
        </div>

        <div class="card">
            <h2>Disk Usage</h2>
            <p id="sto-value" class="data-text">Loading...</p>
        </div>
      
        <div class="card">
            <h2>Bytes Sent</h2>
            <p id="bst-value" class="data-text">Loading...</p>
        </div>

        <div class="card">
            <h2>Bytes Received</h2>
            <p id="brv-value" class="data-text">Loading...</p>
        </div>

        <div class="card">
            <h2>Uptime</h2>
            <p id="upt-value" class="data-text">Loading...</p>
        </div>        
        
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
